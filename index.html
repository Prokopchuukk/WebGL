<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>PA#2 - Variant 17 (Phong Shading & Facet Average)</title>
<style>
    body {
        background-color: #EEEEEE;
        font-family: sans-serif;
    }
    .controls {
        margin-bottom: 15px;
        background: #fff;
        padding: 10px 15px;
        border-radius: 6px;
        display: inline-block;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .control-group {
        margin: 5px 0;
    }
    label {
        display: inline-block;
        width: 140px;
        font-weight: bold;
    }
</style>

<script src="./Utils/trackball-rotator.js"></script>
<script src="./Utils/m4.js"></script>
<script src="./shader.gpu"></script>
<script src="./Model.js"></script>
<script src="./main.js"></script>

</head>
<body onload="init()">

<h2>Surface of Revolution of a General Sinusoid (Variant 17)</h2>
<p id="message">Drag your mouse on the surface to rotate it. Light orbits automatically.</p>

<div class="controls">
    <div class="control-group">
        <label for="uSlider">U Steps: <span id="uVal">30</span></label>
        <input type="range" id="uSlider" min="5" max="100" value="30" oninput="updateSurface()">
    </div>
    <div class="control-group">
        <label for="vSlider">V Steps: <span id="vVal">30</span></label>
        <input type="range" id="vSlider" min="5" max="100" value="30" oninput="updateSurface()">
    </div>
</div>

<div id="canvas-holder">
   <canvas width="600" height="600" id="webglcanvas" style="background-color:black"></canvas>
</div>

</body>
</html>
